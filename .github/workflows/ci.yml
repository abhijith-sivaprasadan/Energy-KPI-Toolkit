name: CI

on:
  schedule:
    - cron: "22 3 * * 3"
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: "1"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Fresh synthetic KPI workflow and output checks
        run: |
          mkdir -p .ci-kpi
          python run_toolkit.py --workbook Industrial_Energy_KPI_Template.xlsx --csv demo_industrial_energy_data.csv --outdir .ci-kpi --out-workbook .ci-kpi/processed.xlsx
          python -c "import os,pandas as pd; root='.ci-kpi'; names=['results.csv','actions.csv','management_report.pdf','processed.xlsx']; assert all(os.path.getsize(os.path.join(root,n))>0 for n in names); df=pd.read_csv(os.path.join(root,'results.csv')); assert len(df)>0; print('Synthetic KPI workflow generated',len(df),'period rows')"
      - name: Lint
        run: ruff check .

      - name: Format check
        run: black --check .

      - name: Test
        run: pytest -q
