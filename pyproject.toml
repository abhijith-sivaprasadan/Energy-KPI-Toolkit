[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "demo_outputs",
    "demo_outputs_v2",
    "demo_outputs_v3",
    "demo_outputs_v4",
    "demo_outputs_baseline12",
    "render_preview",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
